name: Maven Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/maven.yml'
      - '.mvn/wrapper/**'
      - 'pom.xml'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/maven.yml'
      - '.mvn/wrapper/**'
      - 'pom.xml'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      # Testcontainers uses the Docker engine that ships with the GitHub-hosted Ubuntu runner
      - name: Build and test with Maven
        run: mvn -B -ntp package --file pom.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/*.mp4
            target/*.flv
          retention-days: 7

  # Merge Dependabot patch/minor updates only after the build above is green
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash and merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
